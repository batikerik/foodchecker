<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Состав — проверка</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #0e1116;
    --card: #171b22;
    --card-2: #1e232c;
    --line: #2a303b;
    --text: #e8ecf2;
    --muted: #99a2b0;
    --accent: #4f8cff;
    --good: #3ecf8e;
    --ok: #d8c04a;
    --warn: #f0913e;
    --bad: #f0574f;
  }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 19px; margin: 0; flex: 1; letter-spacing: -0.2px; }
  header .logo { font-size: 26px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    width: 40px; height: 40px; border-radius: 12px; font-size: 18px;
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--card-2); }
  .icon-btn.on { color: var(--accent); border-color: var(--accent); }

  .shoot {
    display: block; width: 100%; padding: 22px; border-radius: 20px;
    background: linear-gradient(140deg, #4f8cff, #6f5bff);
    color: #fff; border: 0; font-size: 18px; font-weight: 600;
    cursor: pointer; box-shadow: 0 10px 30px -12px rgba(79,140,255,.8);
  }
  .shoot:active { transform: scale(.985); }
  .shoot small { display: block; font-weight: 400; opacity: .85; font-size: 13px; margin-top: 4px; }
  .sub-actions { display: flex; gap: 10px; margin-top: 10px; }
  .sub-actions button {
    flex: 1; padding: 12px; border-radius: 14px; background: var(--card);
    border: 1px solid var(--line); color: var(--muted); font-size: 14px; cursor: pointer;
  }
  .sub-actions button:active { background: var(--card-2); }
  input[type=file] { display: none; }

  .preview { margin-top: 16px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .preview img { display: block; width: 100%; max-height: 300px; object-fit: cover; }

  .panel {
    margin-top: 16px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 4px; }
  .panel p.hint { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 11px 12px;
    font: inherit; font-size: 15px; resize: vertical;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .save {
    width: 100%; margin-top: 16px; padding: 13px; border-radius: 14px;
    border: 0; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }

  .status { margin-top: 20px; text-align: center; color: var(--muted); font-size: 15px; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--bad); }

  .score-card { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; text-align: center; }
  .score-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
  .score-num span { font-size: 20px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .verdict { display: inline-block; margin-top: 10px; padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .bar { height: 7px; border-radius: 999px; background: var(--card-2); margin-top: 16px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; transition: width .6s ease; }
  .product { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .summary { margin-top: 12px; font-size: 15px; }

  section.block { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  section.block h3 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  ul.list { margin: 0; padding: 0; list-style: none; }
  ul.list li { position: relative; padding-left: 20px; margin-bottom: 9px; font-size: 15px; }
  ul.list li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  ul.list li:last-child { margin-bottom: 0; }
  ul.list.danger li::before { background: var(--bad); }
  ul.list.good li::before { background: var(--good); }
  ul.list.you li::before { background: var(--accent); }

  .ing { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ing:last-child { border-bottom: 0; padding-bottom: 0; }
  .ing:first-child { padding-top: 0; }
  .ing-head { display: flex; align-items: center; gap: 8px; }
  .ing-name { font-weight: 600; font-size: 15px; flex: 1; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .ing-note { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .t-good { background: rgba(62,207,142,.15); color: var(--good); }
  .t-ok   { background: rgba(216,192,74,.15);  color: var(--ok); }
  .t-warn { background: rgba(240,145,62,.15);  color: var(--warn); }
  .t-bad  { background: rgba(240,87,79,.15);   color: var(--bad); }

  .disclaimer { margin-top: 22px; color: var(--muted); font-size: 12px; text-align: center; line-height: 1.5; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🔬</div>
    <h1>Проверка состава</h1>
    <button class="icon-btn" id="btnSettings" title="Мой профиль" aria-label="Мой профиль">⚙</button>
  </header>

  <button class="shoot" id="btnShoot">
    📷 Сфотографировать состав
    <small>наведи на список ингредиентов</small>
  </button>
  <div class="sub-actions">
    <button id="btnGallery">🖼 Выбрать из галереи</button>
  </div>

  <input type="file" id="fileCamera" accept="image/*" capture="environment">
  <input type="file" id="fileGallery" accept="image/*">

  <!-- Профиль -->
  <div class="panel hidden" id="settings">
    <h2>Мой профиль</h2>
    <p class="hint">Используется, чтобы оценка была лично про тебя. Хранится только в этом браузере.</p>
    <div class="row">
      <div>
        <label for="age">Возраст</label>
        <input type="text" id="age" inputmode="numeric" placeholder="34">
      </div>
      <div>
        <label for="sex">Пол</label>
        <select id="sex">
          <option value="">—</option>
          <option>мужской</option>
          <option>женский</option>
        </select>
      </div>
    </div>
    <label for="allergies">Аллергии и непереносимости</label>
    <input type="text" id="allergies" placeholder="орехи, лактоза, глютен">
    <label for="conditions">Хронические заболевания</label>
    <input type="text" id="conditions" placeholder="диабет 2 типа, гастрит">
    <label for="states">Особые состояния</label>
    <input type="text" id="states" placeholder="беременность, грудное вскармливание">
    <label for="diet">Диета и ограничения</label>
    <input type="text" id="diet" placeholder="без сахара, вегетарианство">
    <label for="notes">Дополнительно</label>
    <textarea id="notes" rows="2" placeholder="что ещё важно знать"></textarea>
    <button class="save" id="btnSave">Сохранить</button>
  </div>

  <div class="preview hidden" id="preview"><img id="previewImg" alt="Снятый состав"></div>

  <div class="status hidden" id="status"></div>

  <div id="result"></div>

  <p class="disclaimer">
    Это не медицинская консультация. При серьёзных вопросах о здоровье обратись к врачу.
  </p>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const PROFILE_KEY = "foodchecker.profile";
  const FIELDS = ["age", "sex", "allergies", "conditions", "states", "diet", "notes"];

  // ---- профиль ----
  function loadProfile() {
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY)) ?? {}; }
    catch { return {}; }
  }
  function fillForm() {
    const p = loadProfile();
    FIELDS.forEach((f) => { $(f).value = p[f] ?? ""; });
    markProfile();
  }
  function markProfile() {
    const p = loadProfile();
    $("btnSettings").classList.toggle("on", FIELDS.some((f) => (p[f] ?? "").trim()));
  }
  $("btnSave").addEventListener("click", () => {
    const p = {};
    FIELDS.forEach((f) => { p[f] = $(f).value.trim(); });
    localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
    markProfile();
    $("settings").classList.add("hidden");
  });
  $("btnSettings").addEventListener("click", () => $("settings").classList.toggle("hidden"));
  fillForm();

  // ---- съёмка ----
  $("btnShoot").addEventListener("click", () => $("fileCamera").click());
  $("btnGallery").addEventListener("click", () => $("fileGallery").click());
  ["fileCamera", "fileGallery"].forEach((id) => {
    $(id).addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      e.target.value = "";
      if (file) run(file);
    });
  });

  // Сжимаем до разумного размера — иначе фото с телефона улетает на 8+ МБ.
  function compress(file, maxSide = 1600, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve({ dataUrl, base64: dataUrl.split(",")[1] });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не удалось открыть фото.")); };
      img.src = url;
    });
  }

  function setStatus(html, isError = false) {
    const el = $("status");
    el.className = "status" + (isError ? " error" : "");
    el.innerHTML = html;
    el.classList.toggle("hidden", !html);
  }

  async function run(file) {
    $("result").innerHTML = "";
    setStatus('<div class="spinner"></div>Читаю состав…');

    let shot;
    try {
      shot = await compress(file);
    } catch (err) {
      setStatus(err.message, true);
      return;
    }

    $("previewImg").src = shot.dataUrl;
    $("preview").classList.remove("hidden");

    try {
      const res = await fetch("/api/analyze", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          image: shot.base64,
          mediaType: "image/jpeg",
          profile: loadProfile(),
        }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(data?.error || "Сервер не ответил.");
      if (!data) throw new Error("Сервер вернул непонятный ответ.");
      setStatus("");
      render(data);
    } catch (err) {
      // TypeError от fetch — это обрыв сети, показывать «Failed to fetch» бессмысленно
      const msg = err instanceof TypeError
        ? "Нет связи с сервером. Проверь интернет и попробуй ещё раз."
        : err.message || "Что-то пошло не так. Попробуй ещё раз.";
      setStatus(msg, true);
    }
  }

  // ---- отрисовка ----
  const RISK_CLASS = {
    "безопасно": "t-good", "нейтрально": "t-ok",
    "внимание": "t-warn", "опасно": "t-bad",
  };
  const VERDICT_CLASS = {
    "хорошо": "t-good", "приемлемо": "t-ok",
    "с осторожностью": "t-warn", "плохо": "t-bad",
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function scoreColor(n) {
    if (n >= 85) return "var(--good)";
    if (n >= 65) return "var(--ok)";
    if (n >= 40) return "var(--warn)";
    return "var(--bad)";
  }

  function listBlock(title, items, cls) {
    if (!items?.length) return "";
    return `<section class="block"><h3>${esc(title)}</h3><ul class="list ${cls}">
      ${items.map((i) => `<li>${esc(i)}</li>`).join("")}
    </ul></section>`;
  }

  function render(d) {
    if (d.readable === false) {
      setStatus(esc(d.summary || "Состав на фото не читается — попробуй снять ближе и без бликов."), true);
      return;
    }

    const score = Math.max(0, Math.min(100, Math.round(Number(d.score) || 0)));
    const color = scoreColor(score);
    let html = `
      <div class="score-card">
        <div class="score-num" style="color:${color}">${score}<span>/100</span></div>
        <div class="verdict ${VERDICT_CLASS[d.verdict] ?? "t-ok"}">${esc(d.verdict)}</div>
        <div class="bar"><i style="width:${score}%;background:${color}"></i></div>
        ${d.product ? `<div class="product">${esc(d.product)}</div>` : ""}
        <div class="summary">${esc(d.summary)}</div>
      </div>`;

    html += listBlock("Лично для тебя", d.personal, "you");
    html += listBlock("На что обратить внимание", d.concerns, "danger");

    if (d.ingredients?.length) {
      html += `<section class="block"><h3>Состав по пунктам</h3>
        ${d.ingredients.map((i) => `
          <div class="ing">
            <div class="ing-head">
              <span class="ing-name">${esc(i.name)}</span>
              <span class="tag ${RISK_CLASS[i.risk] ?? "t-ok"}">${esc(i.risk)}</span>
            </div>
            <div class="ing-note">${esc(i.note)}</div>
          </div>`).join("")}
      </section>`;
    }

    html += listBlock("Кому не стоит", d.avoid_for, "danger");
    html += listBlock("Кому можно", d.ok_for, "good");

    $("result").innerHTML = html;
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  }
})();
</script>
</body>
</html>
